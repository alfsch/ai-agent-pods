name: Publish base image

# Builds Dockerfile.base (the tools every agent image shares, no agent) for amd64 and arm64 and publishes it to
# ghcr.io/alfsch/agent-pod-base under the tag `install.sh --base-hash` prints: a hash of Dockerfile.base and
# pod-environment.md. install.sh pulls that tag and falls back to a local build, so this workflow only makes starts
# faster; nothing depends on it. It never publishes an agent (Claude Code and Copilot CLI are proprietary; each user
# installs them in their own build).
#
# The weekly run rebuilds the same tag from scratch to pick up Debian security fixes. The package is private until it
# is made public once by hand (GitHub: Packages > agent-pod-base > Package settings > Change visibility), and it is linked
# to this repository there as well. Cron times are UTC (05:17 CEST, 04:17 CET).
#
# The merged tag is signed keylessly with cosign (Sigstore): the signature binds the image digest to this workflow on
# main, so install.sh can check that a pulled base was built here and not pushed by hand. The identity it checks
# (SIGNER_IDENTITY in install.sh) names this file: renaming it means changing both.
#
# The signed digest is scanned with Trivy afterwards (the scan job). It only reports: the findings are in the job
# summary and the job never fails on them, since the image is already published and signed by then and the weekly
# rebuild is what picks up fixes.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - pod-environment.md
      - .github/workflows/publish-base.yaml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Two publishes of the same tag must not interleave; a running one is finished, not cancelled.
concurrency:
  group: publish-base
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alfsch/agent-pod-base

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: hash
        run: echo "tag=$(./install.sh --base-hash)" >> "$GITHUB_OUTPUT"

  # One native build per architecture (QEMU would make the tesseract and apt layers very slow), pushed by digest and
  # joined into one multi-arch tag by the merge job.
  build:
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.base
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.create.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write   # the OIDC token cosign signs with
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tag
        id: create
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/digests"
          sources="$(printf "$IMAGE@sha256:%s " *)"
          # The digest of an index is the sha256 of its bytes, so it is computed from the manifest that is about to be
          # pushed and handed to the signing step. Nothing looks the tag up again: anything else that writes to the
          # package could have moved it, and the workflow would sign whatever it points at with its own identity.
          # shellcheck disable=SC2086
          manifest="$(docker buildx imagetools create --dry-run -t "$IMAGE:$TAG" $sources)"
          digest="sha256:$(printf '%s' "$manifest" | sha256sum | cut -d' ' -f1)"
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$IMAGE:$TAG" $sources
          # Exactly that manifest is in the registry now; if the computed digest were wrong this fails instead of signing.
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.create.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"

  # Vulnerability report for the digest that was just signed. Trivy scans one platform of an index (the host's by
  # default), so both are named. Report only: exit-code 0 keeps findings from failing the job, continue-on-error keeps
  # a scanner, database or registry error from failing the workflow after the image is published. The table goes to the
  # job summary and, through tee, to the job log, which is what `gh run view --log` and the API can read (the API has no
  # endpoint for summaries). Unfixed CVEs are left out, they cannot be acted on.
  scan:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.merge.outputs.digest }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Report in the job summary
        if: ${{ !cancelled() }}
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo "### Trivy: $IMAGE@$DIGEST ($PLATFORM)"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "no report: the scan did not finish"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # What users do: install.sh pulls the published tag. Runs on both architectures, on a clean runner with no local copy.
  smoke:
    needs: merge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh pulls the published base and verifies its signature
        run: |
          ./install.sh claude | tee install.log
          grep -q 'Base image is current' install.log
          grep -q 'signature verified' install.log
      - name: The image works
        run: docker run --rm agent-pod:claude bash -c 'claude --version && yq --version && docker --version && git --version'
