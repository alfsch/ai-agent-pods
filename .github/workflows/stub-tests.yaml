name: Stub tests

# The launcher tests run against a stubbed `docker` and need no daemon. What needs a real daemon (rootless
# sidecar, TLS, cache volumes, signal timing through Docker) is the checklist in docs/docker-sidecar.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run obsolete. Every other run gets a group of its own: a group
# keeps only one pending run and cancels older pending ones even without cancel-in-progress, which would drop
# runs on main when pushes come in a burst.
concurrency:
  group: stub-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stub-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checks are in tests/check.sh, so that a developer runs exactly what CI runs.
      - name: Syntax check
        run: tests/check.sh syntax

      - name: ShellCheck
        run: tests/check.sh shellcheck

      # Tests, then the mutants: each launcher with one fix removed must make a test fail.
      - name: Stub tests
        run: tests/check.sh tests

  # The same tests on macOS: the system Bash 3.2 and the BSD userland (no timeout, GNU date or touch -d), which the
  # Linux job never sees. The system Bash comes first in PATH so that the launcher's `env bash` shebang is it, too.
  # No mutants: they test the launcher's logic, which the Linux job covers. Needs no Docker (the tests stub it).
  stub-tests-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Platform
        run: |
          uname -sm; sw_vers -productVersion; /bin/bash --version | head -n1
          command -v timeout || echo "no timeout(1), as on a Mac"

      - name: Syntax check with the system Bash 3.2
        run: /bin/bash tests/check.sh syntax

      - name: Stub tests
        run: PATH=/bin:/usr/bin:$PATH /bin/bash tests/stubbed-docker.sh --no-mutants
