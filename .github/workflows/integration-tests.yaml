name: Integration tests

# Runs tests/integration.sh against a real Docker daemon: the pod images (Claude Code, Copilot CLI and goose) built from the Dockerfile, the pinned
# rootless sidecar, DOCKER=1 sessions, the cache, TLS and signals. This is what tells an update of a tooling
# image (docker CLI, DIND sidecar, node base, yq) from a broken one; the stub tests need no daemon and cannot.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run obsolete. Every other run gets a group of its own: a group
# keeps only one pending run and cancels older pending ones even without cancel-in-progress.
concurrency:
  group: integration-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rootless sidecar needs unprivileged user namespaces, which Ubuntu 24.04 restricts through AppArmor.
      - name: Allow unprivileged user namespaces
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces || true

      # Builds the image from the Dockerfiles of this commit, so an update of the node, docker CLI or yq image is
      # what gets tested: the base image's tag is a hash of Dockerfile.base, so a change to it is not published yet
      # (publish-base.yaml runs on main) and install.sh builds the base here; an unchanged one is pulled.
      - name: Build the image
        run: ./install.sh

      # The pull request build above falls back to building the base, so it passes with a broken cosign invocation (a
      # bumped cosign image, a changed flag). This step needs the verification to succeed on a published base: the one of
      # this commit if it is published, else the newest earlier one of main that is (a change to Dockerfile.base is published
      # only after the merge, and on a push to main the publish workflow runs next to this one).
      - name: The published base is verified by the cosign container
        run: |
          git fetch --depth=100 origin main
          tag="$(tests/published-base-tag.sh)"
          echo "BASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Published base tag: $tag"
          ./install.sh --verify-base "$tag" | tee verify.log
          grep -q 'signature verified' verify.log
      # The same check with a signer identity the published base does not have must fail because of the signature, or the
      # step above proves nothing.
      - name: A wrong signer identity is rejected
        run: |
          sed 's/publish-base\\\.yaml/no-such-workflow\\.yaml/' install.sh > install-wrong-signer.sh
          grep -q 'no-such-workflow' install-wrong-signer.sh
          chmod +x install-wrong-signer.sh
          if ./install-wrong-signer.sh --verify-base "$BASE_TAG" > wrong.log 2>&1; then cat wrong.log; echo 'a wrong signer identity was accepted'; exit 1; fi
          cat wrong.log
          grep -q 'Signature check failed' wrong.log

      - name: Integration tests
        run: tests/integration.sh

      - name: Docker state after a failure
        if: failure()
        run: |
          docker ps -a
          docker network ls
          docker volume ls
          docker image ls
